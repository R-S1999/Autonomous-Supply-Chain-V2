model_name: longmont_oils_fats_delay
network:
  keep_nodes:
    - supplier_flour_great_plains_bulk
    - supplier_flour_regional_fast_response
    - supplier_peanuts_southeast_contract
    - supplier_peanuts_regional_fast_response
    - supplier_fruit_west_bulk
    - supplier_fruit_midwest_fast_response
    - supplier_sugar_bulk_refiner
    - supplier_oils_fats_regional
    - supplier_film_wrap_converter
    - supplier_carton_corrugate_converter
    - inventory_flour_receiving
    - inventory_peanut_receiving
    - inventory_fruit_base_receiving
    - inventory_sugar_oils_receiving
    - inventory_packaging_receiving
    - processing_peanut_butter_network
    - processing_fruit_spread_network
    - plant_longmont_frozen_sandwich
    - frozen_inventory_longmont
    - cold_dc_west
  oil_inventory_kpi:
    name: oil_fat_days_of_cover
    modeled_value: 3
    unit: days
    source_system: SAP_inventory_management_and_tank_telemetry
    source_events: [tank_level_reading, goods_issue_to_production]
    calculation: usable_oil_and_fat_inventory_divided_by_daily_Longmont_requirement
  retailers:
    - id: retailer_costco
      node_type: retailer_distribution_center
      supply_chain_layer: retailer_replenishment
      material_family: frozen_sandwiches
      role: costco_retail_replenishment
      kpis:
        - { name: costco_weekly_receipts_cases, modeled_value: 52000, unit: cases_per_week, source_system: Costco_retailer_portal }
        - { name: costco_fill_rate_pct, modeled_value: 98.5, unit: percent, source_system: Costco_retailer_portal }
        - { name: costco_OTIF_penalty_usd_per_late_case, modeled_value: 3.1, unit: USD_per_case, source_system: SAP_customer_agreement }
    - id: retailer_sams_club
      node_type: retailer_distribution_center
      supply_chain_layer: retailer_replenishment
      material_family: frozen_sandwiches
      role: sams_club_retail_replenishment
      kpis:
        - { name: sams_weekly_receipts_cases, modeled_value: 42000, unit: cases_per_week, source_system: Sams_Club_retailer_portal }
        - { name: sams_fill_rate_pct, modeled_value: 98.5, unit: percent, source_system: Sams_Club_retailer_portal }
        - { name: sams_OTIF_penalty_usd_per_late_case, modeled_value: 3.4, unit: USD_per_case, source_system: SAP_customer_agreement }
    - id: retailer_other
      node_type: retailer_distribution_center
      supply_chain_layer: retailer_replenishment
      material_family: frozen_sandwiches
      role: other_retailer_replenishment
      kpis:
        - { name: other_retailer_weekly_receipts_cases, modeled_value: 26000, unit: cases_per_week, source_system: retailer_order_management }
        - { name: other_retailer_fill_rate_pct, modeled_value: 98.5, unit: percent, source_system: retailer_order_management }
        - { name: other_retailer_OTIF_penalty_usd_per_late_case, modeled_value: 2.2, unit: USD_per_case, source_system: SAP_customer_agreement }
  retailer_relationships:
    - id: rel_west_dc_to_costco
      from: cold_dc_west
      to: retailer_costco
      relationship_type: customer_replenishment_shipment
      material: frozen_sandwich_cases
      modeled_weekly_flow_cases: 52000
      lead_time: { modeled_mean_days: 2, modeled_p90_days: 3, source_systems: [TMS, Costco_retailer_portal] }
      cost: { modeled_freight_cost_usd_per_case: 0.44, source_systems: [TMS_freight_audit] }
    - id: rel_west_dc_to_sams_club
      from: cold_dc_west
      to: retailer_sams_club
      relationship_type: customer_replenishment_shipment
      material: frozen_sandwich_cases
      modeled_weekly_flow_cases: 42000
      lead_time: { modeled_mean_days: 2, modeled_p90_days: 3, source_systems: [TMS, Sams_Club_retailer_portal] }
      cost: { modeled_freight_cost_usd_per_case: 0.46, source_systems: [TMS_freight_audit] }
    - id: rel_west_dc_to_other_retailers
      from: cold_dc_west
      to: retailer_other
      relationship_type: customer_replenishment_shipment
      material: frozen_sandwich_cases
      modeled_weekly_flow_cases: 26000
      lead_time: { modeled_mean_days: 2, modeled_p90_days: 4, source_systems: [TMS, retailer_order_management] }
      cost: { modeled_freight_cost_usd_per_case: 0.52, source_systems: [TMS_freight_audit] }

events:
  - id: TAC_001_oils_fats_inbound_delay
    event_horizon: tactical
    event_type: raw_material_inbound_delay
    status: active
    trigger_window: { expected_start_in_days: 3, expected_duration_days: 5, planning_bucket: daily }
    business_question: How should Longmont protect retailer fulfillment when the inbound oils and fats tanker is five days late?
    signal_sources:
      - { system: SAP_material_management, events: [purchase_order_delivery_exception] }
      - { system: TMS_carrier_tracking, events: [late_tanker] }
    affected_model_objects:
      nodes: [supplier_oils_fats_regional, inventory_sugar_oils_receiving, processing_fruit_spread_network, plant_longmont_frozen_sandwich, frozen_inventory_longmont, cold_dc_west, retailer_costco, retailer_sams_club, retailer_other]
      relationships: [rel_oils_to_sugar_oils_inventory, rel_sugar_oils_to_secondary_processing, rel_fruit_spread_to_sandwich_plants, rel_longmont_to_fg_inventory, rel_longmont_fg_to_west_dc, rel_west_dc_to_costco, rel_west_dc_to_sams_club, rel_west_dc_to_other_retailers]
    overlay_patches:
      - { target_type: node, target_id: inventory_sugar_oils_receiving, metric: oil_fat_days_of_cover, baseline_value: 3, scenario_value: 0, operation: replace }
      - { target_type: relationship, target_id: rel_oils_to_sugar_oils_inventory, path: lead_time.modeled_mean_days, baseline_value: 5, scenario_value: 10, operation: replace }
    scenario_assumptions:
      horizon_days: 30
      initial_oil_cover_days: 3
      delayed_tanker_days: 5
      weekly_oil_requirement_lb: 145000
      retailer_demand_cases: { costco: 52000, sams_club: 42000, other: 26000 }
    estimated_no_action_impact: { service_risk: high }
    candidate_interventions:
      - { id: expedite_delayed_oil_tanker, action_type: transport_expedite, incremental_cost_usd: 85000, expected_effect: Recover the delayed tanker three days earlier, risk: carrier_capacity }
      - { id: source_emergency_oil_supply, action_type: alternate_source_fulfillment, incremental_cost_usd: 135000, expected_effect: Deliver five days of qualified emergency oil supply before inventory runs out, risk: spot_price_and_quality_release }
      - { id: prioritize_longmont_oil_allocation, action_type: allocation_priority, incremental_cost_usd: 45000, expected_effect: Prioritize lower-oil priority SKUs and protect Costco and Sam's Club orders, risk: deferred_other_retailer_orders }
    recommended_intervention_id: source_emergency_oil_supply
