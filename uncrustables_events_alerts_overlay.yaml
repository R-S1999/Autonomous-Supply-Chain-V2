model_name: uncrustables_event_alerts_overlay
purpose: Scenario and alert overlay file. Simulation engine applies patches to BAU graph KPIs and relationship lead times/costs, runs
  scenario, and stores impact/recommendation.
applies_to_bau_graph: uncrustables_bau_graph_cost_enriched.yaml
time_grain: daily_for_tactical_alerts_weekly_for_long_term_alerts
overlay_semantics:
  do_not_mutate_bau_file: true
  simulation_step: copy_BAU_graph_to_scenario_graph_then_apply_event_overlay_patches
  patch_matching: target_type_plus_target_id_plus_metric_name_or_path
  cost_impact_convention: incremental_cost_vs_BAU_for_modeled_event_horizon
  recommended_output: rank_interventions_by_OTIF_recovery_inventory_risk_and_incremental_cost
events:
- id: LT_001_peanut_price_weather_supply_risk
  event_horizon: long_term
  event_type: raw_material_price_and_capacity_risk
  status: forecast_watch
  trigger_window:
    expected_start_in_days: 180
    expected_duration_days: 90
    planning_bucket: monthly_then_weekly_after_90_days
  business_question: Should we forward-buy peanuts or shift allocation before weather-driven peanut inflation reaches supplier contracts?
  signal_sources:
  - system: external_news_and_weather_intelligence
    events:
    - bad_weather_report_in_peanut_source_regions
    - crop_yield_outlook_revision
  - system: commodity_procurement_workbench
    events:
    - peanut_forward_price_update
    - supplier_quote_revision
  - system: SRM_supplier_portal
    events:
    - supplier_capacity_advisory
    - contract_reopener_notice
  affected_model_objects:
    nodes:
    - supplier_peanuts_southeast_contract
    - supplier_peanuts_regional_fast_response
    - inventory_peanut_receiving
    - processing_peanut_butter_network
    relationships:
    - rel_peanut_contract_to_peanut_inventory
    - rel_peanut_fast_to_peanut_inventory
    - rel_peanut_inventory_to_peanut_butter_processing
  overlay_patches:
  - target_type: node
    target_id: supplier_peanuts_southeast_contract
    metric: contract_peanut_cost_usd_per_lb
    baseline_value: 0.82
    scenario_value: 1.02
    operation: replace
  - target_type: node
    target_id: supplier_peanuts_southeast_contract
    metric: contracted_peanut_capacity_lb_per_week
    baseline_value: 720000
    scenario_value: 610000
    operation: replace
  - target_type: node
    target_id: supplier_peanuts_regional_fast_response
    metric: emergency_peanut_cost_usd_per_lb
    baseline_value: 0.96
    scenario_value: 1.22
    operation: replace
  - target_type: node
    target_id: supplier_peanuts_regional_fast_response
    metric: spot_peanut_available_capacity_lb_per_week
    baseline_value: 250000
    scenario_value: 185000
    operation: replace
  - target_type: relationship
    target_id: rel_peanut_contract_to_peanut_inventory
    path: lead_time.modeled_mean_days
    baseline_value: 8
    scenario_value: 12
    operation: replace
  - target_type: relationship
    target_id: rel_peanut_contract_to_peanut_inventory
    path: lead_time.modeled_p90_days
    baseline_value: 12
    scenario_value: 18
    operation: replace
  - target_type: node
    target_id: inventory_peanut_receiving
    metric: peanut_days_of_cover
    baseline_value: 12
    scenario_value: 8
    operation: replace
  scenario_assumptions:
    weekly_peanut_requirement_lb: 970000
    affected_weeks: 12
    expected_cost_increase_usd_per_lb_weighted: 0.21
    capacity_shortfall_lb_per_week: 175000
  estimated_no_action_impact:
    incremental_raw_material_cost_usd: 2444000
    shortfall_recovery_or_emergency_buy_cost_usd: 945000
    additional_storage_or_quality_hold_cost_usd: 180000
    total_incremental_cost_usd: 3569000
    service_risk: medium_high
  candidate_interventions:
  - id: forward_buy_8_weeks_peanuts
    action_type: forward_buy
    expected_effect: lock_pre_increase_price_for_8_weeks_and_raise_peanut_inventory_cover_from_12_to_20_days
    incremental_cost_usd: 620000
    working_capital_cost_usd: 210000
    risk: quality_ageing_and_storage_capacity
  - id: shift_20_pct_to_regional_fast_supplier
    action_type: supplier_allocation_shift
    expected_effect: reduce capacity shortfall but increase unit cost
    incremental_cost_usd: 510000
    risk: higher_spot_cost
  - id: hedge_or_contract_extension
    action_type: commercial_mitigation
    expected_effect: cap price exposure with procurement contract terms
    incremental_cost_usd: 140000
    risk: supplier_acceptance
  recommended_intervention_id: forward_buy_8_weeks_peanuts
  estimated_recommended_net_impact_usd: 1040000
  simulation_instruction: Run weekly scenario for 12 affected weeks; compare no_action vs forward_buy vs allocation_shift on peanut
    cover, peanut butter output, sandwich production continuity, and incremental cost.
